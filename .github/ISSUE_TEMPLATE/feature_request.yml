name: ✨ Feature Request
description: Suggest a new feature or improvement for arch-shield
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see implemented?
    validations:
      required: true
  
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions?
    validations:
      required: false
  
  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to implement this?
      options:
        - "Yes, I can submit a PR"
        - "No, just suggesting"
    validations:
      required: true
